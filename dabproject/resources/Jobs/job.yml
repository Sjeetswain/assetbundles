resources:
  jobs:
    Ingestion_Job:
      name: Ingestion_Job
      tasks:
        - task_key: ingestion
          notebook_task:
            notebook_path: ../../src/notebook/Ingestion.ipynb
            base_parameters:
              Catalog_name: ${var.Catalog_name}
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
